<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial scale=1.0">
        <title>Forgot Password | TBZ Car Rental</title>
        <link rel="stylesheet" href="style_forgot.css">
        <script src="https://kit.fontawesome.com/91d1ad08da.js" crossorigin="anonymous"></script>
    </head>
    <body>

        <!---MAIN CONTAIENR-->
        <div class="main-container">
            <div class="wizard-container">
                
                <div class="wizard-header">
                    <h1>Forgot Password?</h1>
                    <p id="wizard-subtitle">Enter your email that you used to sign in with your account. We'll send you a code.</p>
                </div> 


                <form id="forgot-form">
                    <div class="form-step active" id="step-1">

                        <div class="input-group">
                            <label for="email">Account Email</label>
                            <input type="email" id="email" placeholder="juan@example.com" required>
                        </div>
                    </div>

                    <div class="form-step" id="step-2">
            
                        <div class="input-group">
                            <label for="code">Code Verification</label>
                            <input type="text" id="code" placeholder="Enter Code"pattern="[0-9A-Za-z]{6}" title="Please enter the 6 character code" required>
                        </div>

                    </div>

                    <div class="form-step" id="step-3">
                        <h3 style="margin-top: 0; color: #1b1464;">Account Security Details</h3>

                        <div class="input-group">
                            <label for="passowrd">New Password</label>
                            <input type="password" id="password" placeholder="Minimum 8 characters" minlength="8" required>
                        </div>

                        <div class="input-group">
                            <label for="re-passowrd">Re-type New Password</label>
                            <input type="password" id="re-password" placeholder="••••••••" minlength="8" required>
                        </div>

                    </div>
                    <div class="btn-group">
                        <div class="signup-prompt">
                            <h3>Did you remember?</h3>
                            <a href="../client/login.html">Let's Sign in!</a>
                        </div>
                        <div class="action-btn">
                            <button type="button" class="btn btn-prev" id="btn-prev" style="display: none;">Back</button>
                            <button type="button" class="btn btn-primary" id="btn-next">Send Code</button>
                        </div>
                    </div>
                </form>
    
            </div>
        </div>
       
        
        <!--FOOTER CONTAINER-->

        <footer class="footer-container">
            <div class="footer-bottom">
                <p>&copy; 2026 TBZ Car Rental. All Rights Reserved.</p>
            </div>

        </footer>


    </body>
    <script src="script_forgot.js"></script>
</html>
