<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial scale=1.0">
        <title>Create an Account</title>
        <link rel="stylesheet" href="style_creatacc.css">
        <script src="https://kit.fontawesome.com/91d1ad08da.js" crossorigin="anonymous"></script>
    </head>
    <body>

        <!---MAIN CONTAIENR-->
        
        <div class="main-container">
            <div class="wizard-container">
                
                <div class="wizard-header">
                    <h1>Create an Account</h1>
                    <p>Join us today to easily book your next getaway car!</p>
                </div>

                <div class="stepper-bar">
                    <div class="stepper-progress" id="progress"></div>
                    <div class="step active">1</div>
                    <div class="step">2</div>
                    <div class="step">3</div>
                </div>

                <form id="register-form">
                    <div class="form-step active" id="step-1">
                        <h3 style="margin-top: 0; color: #1b1464;">Personal Information</h3>

                        <div class="input-group">
                            <label for="fname">First Name</label>
                            <input type="text" id="fname" placeholder="Enter First Name" required>
                        </div>

                        <div class="input-group">
                            <label for="lname">Last Name</label>
                            <input type="text" id="lname" placeholder="Enter Last Name" required>
                        </div>
                    </div>

                    <div class="form-step" id="step-2">
                        <h3 style="margin-top: 0; color: #1b1464;">Contact Details</h3>

                        <div class="input-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" placeholder="09XX XXX XXXX" required pattern="[0-9]{11}" title="Must be an 11-digit number">
                        </div>

                        <div class="input-group">
                            <label for="city">City / Municipality</label>
                            <select id="city" required>
                                <option value="" disabled selected>Select your city...</option>
                                <option value="urdaneta">Urdaneta City</option>
                                <option value="dagupan">Dagupan City</option>
                                <option value="other">Others</option>
                            </select>
                        </div>

                    </div>

                    <div class="form-step" id="step-3">
                        <h3 style="margin-top: 0; color: #1b1464;">Account Security Details</h3>

                        <div class="input-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" placeholder="juandelacruz@gmail.com" required>
                        </div>

                        <div class="input-group">
                            <label for="passowrd">Password</label>
                            <input type="password" id="password" placeholder="Minimum 8 characters" minlength="8" required>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn btn-prev" id="btn-prev" style="display: none;">Back</button> <!--BTN HIDDEN on init check js-->
                        <button type="button" class="btn btn-next" id="btn-next">Next</button>
                    </div>
                </form>
    
            </div>
        </div>
        
        
        <!--FOOTER CONTAINER-->

        <footer class="footer-container">
            <div class="footer-bottom">
                <p>&copy; 2026 TBZ Car Rental. All Rights Reserved.</p>
            </div>

        </footer>


    </body>
    <script src="script_create.js"></script>
</html>
